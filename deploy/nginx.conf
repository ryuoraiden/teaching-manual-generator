# Reverse proxy for the Teaching Manual Generator.
# Copy to the server as /etc/nginx/sites-available/teaching-manual, then enable
# (see DEPLOY.md). Replace `server_name _;` with your domain once you have one.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Textbook + handbook PDFs are uploaded through here; the nginx default cap
    # is 1 MB, which would reject real textbooks. Allow generous uploads.
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Manual generation (Gemini + PDF parsing) can take ~30s. Don't let
        # nginx time out at its 60s default mid-generation.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
